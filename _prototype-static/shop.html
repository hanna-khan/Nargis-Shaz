<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop — Nargis &amp; Shaz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
<div id="site-header"></div>
<main>
  <section class="page-top">
    <span class="eyebrow">Shop</span>
    <h1 class="display h2" id="shopTitle">The <em>collection</em></h1>
    <p class="muted" id="shopBlurb"></p>
  </section>
  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <div style="display:flex;align-items:center;gap:20px;justify-content:space-between">
      <span class="count-note" id="shopCount"></span>
      <select class="sort" id="sort" aria-label="Sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>
    </div>
  </div>
  <section class="grid" id="grid"></section>
</main>
<div id="site-footer"></div>
<script src="js/art.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
